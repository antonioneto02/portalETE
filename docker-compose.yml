services:
  portal-ete:
    image: portal-ete:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-ete
    restart: unless-stopped
    ports:
      - "3021:3021"
    env_file:
      - .env
    environment:
      CERT_DIR: C:/certs
    volumes:
      # Pasta inteira (nao so o codigo copiado na imagem): restart via
      # supervisor pega o que estiver salvo no disco na hora, sem rebuild.
      - C:/Projetos/portalETE:C:/app
      - C:/Projetos/Certificados:C:/certs:ro
